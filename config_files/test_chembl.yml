experiment:
  dataset:
    name: chembl
    item: # infos related to item dataset (mandatory, at least item_id)
      path: datasets/chembl/processed/item.csv
      extra_features: 
        - molecular_weight
        - number_ro5_violations
        - alogp
        - smiles
        - standard_relation
        - value(nM)
        - cid
        - molecular_formula
        - inchi
        - tpsa
    # features(columns) beside item_id to be used
    user: # mandatory (at least user_id)
      path: datasets/chembl/processed/user.csv
      extra_features: [target_type] # features beside user_id
    ratings: # mandatory (at least [user_id, item_id, rating])
      path: datasets/chembl/processed/rating.csv
      timestamp: False

  preprocess:
    - method: filter_kcore
      parameters:
        k: 20
        iterations: 1
        target: user # user or rating

  split:
    seed: 42
    test:
      method: k_fold
      k: 2
      level: "user"

  models:
    - name: deepwalk_based
      config:
        save_weights: True
      parameters:
        walk_len: 10
        p: 1.0
        q: 1.0
        n_walks: 50
        embedding_size: 64
        epochs: 1

  evaluation:
    k: 100
    relevance_threshold: 1
    metrics: [F-score]

  report:
    file: "experiment_results/chembl/test1.csv"
