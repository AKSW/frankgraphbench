experiment:
  dataset:
    name: ml-100k
    item: # infos related to item dataset (mandatory, at least item_id)
      path: datasets/ml-100k/processed/item.csv
      extra_features: [movie_year, movie_title] # features(columns) beside item_id to be used
    user: # mandatory (at least user_id)
      path: datasets/ml-100k/processed/user.csv
      extra_features: [gender, occupation] # features beside user_id
    ratings: # mandatory (at least [user_id, item_id, rating])
      path: datasets/ml-100k/processed/rating.csv
      timestamp: True

  preprocess:
    - method: filter_kcore
      parameters:
        k: 20
        iterations: 1
        target: user # user or rating

  split:
    seed: 42

    test:
      method: k_fold
      k: 5
      level: "user"

  models:
    - name: cKE
      config:
        save_weights: True
      parameters:
        embed_size: 150
        epoch: 1000
        verbose: 10
        validate_factor: 50 # for ml-1m 200
        validate_frac: .001  # for ml-1m .0001
        test_flag: sort
    - name: kGAT
      config:
        save_weights: True
      parameters:
        embed_size: 150
        epoch: 1000
        verbose: 10
        validate_factor: 50 # for ml-1m 200
        validate_frac: .001  # for ml-1m .0001
        test_flag: sort

  evaluation:
    k: 10
    relevance_threshold: 0
    metrics: [MAP, nDCG, precision, recall, F-score]

  report:
    file: "experiment_results/kge_parameters/ml-100k_gnn_embedding-1.csv"
    execution_times:
      file: "experiment_results/kge_parameters/ml-100k_gnn_embedding-1.csv"