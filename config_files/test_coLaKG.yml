experiment:
  dataset:
    name: ml-100k
    item: # infos related to item dataset (mandatory, at least item_id)
      path: datasets/ml-100k/processed/item.csv
      extra_features: [movie_year, movie_title] # features(columns) beside item_id to be used
    user: # mandatory (at least user_id)
      path: datasets/ml-100k/processed/user.csv
      extra_features: [gender, occupation] # features beside user_id
    ratings: # mandatory (at least [user_id, item_id, rating])
      path: datasets/ml-100k/processed/rating.csv
      timestamp: True

  preprocess:
    - method: filter_kcore
      parameters:
        k: 20
        iterations: 1
        target: user # user or rating

  split:
    seed: 42
    test:
      method: k_fold
      k: 5
      level: "user"

  models:
    - name: coLaKG
      config:
        save_weights: True
      parameters:
        item_name: movie_title
        model_host: http://mac.fritz.box:11434
        # model_host: http://localhost:11434
        model_name: qwen3:1.7b
        emb_model_name: qwen3-embedding:0.6b
        walk_len: 10
        latent_dim_rec: 64
        lightGCN_n_layers: 3
        use_drop_edge: 1
        keep_prob: 0.8
        bpr_batch_size: 2048
        test_u_batch_size: 100
        neighbor_k: 10
        dropout_i: 0.6
        dropout_u: 0.6
        dropout_n: 0.6
        semantic_hid_dim: 32
        device: auto
        # Limits for the LLM/embedding calls; null => use every node.
        # Set a small integer (e.g. 10) to smoke-test the pipeline quickly.
        item_llm_limit: null
        user_llm_limit: null
        epochs: 1000

  evaluation:
    k: 10
    relevance_threshold: 0
    metrics: [MAP, nDCG]

  report:
    file: "experiment_results/fixed_db16_runs/test_colakg.csv"