experiment:
  dataset:
    name: chembl-trypanosoma-coconut
    item: # infos related to item dataset (mandatory, at least item_id)
      path: datasets/chembl-trypanosoma/processed/item.csv
      extra_features: # number columns don't work with translation model
        - molecule_chembl_id
        - molecular_weight # number
        - number_ro5_violations # number
        - alogp # number
        - smiles
        - standard_relation
        - value(nM) # number
        - cid # number
        - molecular_formula
        - inchi
        - tpsa # number
    # features(columns) beside item_id to be used
    user: # mandatory (at least user_id)
      path: datasets/chembl-trypanosoma/processed/user.csv
      extra_features: [target_type] # features beside user_id
    ratings: # mandatory (at least [user_id, item_id, rating])
      path: datasets/chembl-trypanosoma/processed/rating.csv
      timestamp: False
    enrich:
      map_path: datasets/chembl-trypanosoma/processed/map.csv
      enrich_path: datasets/chembl-trypanosoma/processed/enriched.csv
      remove_unmatched: False
      properties:
        - coco_id
        - canonical_smiles
        - name
        - annotation_level
        - total_atom_count # number
        - heavy_atom_count # number
        - exact_molecular_weight # number
        - topological_polar_surface_area # number
        - rotatable_bond_count # number
        - hydrogen_bond_acceptors # number
        - hydrogen_bond_donors # number 
        - hydrogen_bond_acceptors_lipinski # number
        - hydrogen_bond_donors_lipinski # number
        - lipinski_rule_of_five_violations # number
        - aromatic_rings_count # number
        - qed_drug_likeliness # number
        - formal_charge # number
        - fractioncsp3 # number
        - number_of_minimal_rings # number
        - van_der_walls_volume # number
        - contains_sugar
        - contains_ring_sugars
        - contains_linear_sugars
        - murcko_framework
        - np_likeness # number
        - chemical_class
        - chemical_sub_class
        - chemical_super_class
        - direct_parent_classification
        - np_classifier_pathway
        - np_classifier_superclass
        - np_classifier_class
        - np_classifier_is_glycoside
        - organisms
        - collections
        - dois
        - synonyms
        - cas

  preprocess:
    - method: filter_kcore
      parameters:
        k: 5 # guarantees enough samples for for kfold
        iterations: 1
        target: user # user or rating

  split:
    seed: 42
    test:
      method: k_fold
      k: 5
      level: "user"

  models:
    - name: coLaKG
      config:
        save_weights: True
      parameters:
        item_name: compound
        model_host: http://mac.fritz.box:11434
        model_name: medgemma:27b
        emb_model_name: embeddinggemma-2:740m
        # MANDATORY: item_system_prompt and user_system_prompt are required (no defaults).
        # They are the instructions sent to the LLM and drive how it writes the
        # semantic descriptions (item and user) that are then embedded and used for
        # recommendations. Tune them to steer the generated descriptions.
        item_system_prompt: >-
          Assume you are an expert in computational drug discovery to attack trypanosoma and related proteins.
          You will be given some information about a compound that might or not be effective against it.
          Based on this information and your world knowledge,
          please analyze and summarize the characteristics of this compound,
          and if it would be effective against trypanosoma.
          Your response should be a coherent paragraph with no more than 200 words.
        user_system_prompt: >-
          Assume you are an expert in computational drug discovery to attack trypanosoma and related proteins.
          You will be given information about trypanosoma or a related protein.
          Based on this information and your world knowledge,
          please analyze and summarize the characteristics of the organism or that single protein,
          and analyze what kind of compound could be effective to attack it.
          Your response should be a coherent paragraph with no more than 200 words.
        walk_len: 10
        latent_dim_rec: 64
        lightGCN_n_layers: 3
        use_drop_edge: 1
        keep_prob: 0.8
        bpr_batch_size: 2048
        test_u_batch_size: 100
        neighbor_k: 10
        dropout_i: 0.6
        dropout_u: 0.6
        dropout_n: 0.6
        semantic_hid_dim: 32
        device: auto
        # Limits for the LLM/embedding calls; null => use every node.
        # Set a small integer (e.g. 10) to smoke-test the pipeline quickly.
        item_llm_limit: null
        user_llm_limit: null
        epochs: 1000

  evaluation:
    k: 100
    relevance_threshold: 1
    metrics: [F-score, recall, precision, MAP, nDCG]

  report:
    file: "experiment_results/chembl/test_chembl-trypanosoma_coco_colakg.csv"
    execution_times:
      file: "experiment_results/chembl/test_chembl-trypanosoma_coco_colakg_times.csv"
